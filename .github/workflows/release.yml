name: Release

# Triggered when a version tag is pushed (e.g. v1.24.2).
# Builds the Chrome (.zip) and Firefox (.xpi) packages and creates the GitHub
# release with both files attached.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Node (syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify that the tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' manifest.json | head -1 | sed 's/.*"\([0-9][^"]*\)"/\1/')
          echo "Tag: $TAG — manifest: $MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG does not match version $MANIFEST in manifest.json"
            exit 1
          fi

      - name: Build the packages
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh

      - name: Extract the release notes from the CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See CHANGELOG.md for the detailed list of changes." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kanban Flow ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.xpi

      - name: Keep the packages (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: kanban-flow-packages
          path: dist/*
