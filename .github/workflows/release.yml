name: Release

# Déclenché quand on pousse une étiquette de version (ex. v1.24.2).
# Construit les paquets Chrome (.zip) et Firefox (.xpi) et crée la release GitHub
# avec les deux fichiers en pièces jointes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node (contrôle syntaxique)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier que l'étiquette correspond au manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' manifest.json | head -1 | sed 's/.*"\([0-9][^"]*\)"/\1/')
          echo "Étiquette : $TAG — manifest : $MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::L'étiquette v$TAG ne correspond pas à la version $MANIFEST de manifest.json"
            exit 1
          fi

      - name: Construire les paquets
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh

      - name: Extraire les notes de version du CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Voir CHANGELOG.md pour le détail des modifications." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kanban Flow ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.xpi

      - name: Conserver les paquets (exécution manuelle)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: kanban-flow-packages
          path: dist/*
